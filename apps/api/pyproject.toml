[project]
name = "llm-visualization-lab-api"
version = "0.1.0"
description = "Real raw next-token inference foundation for LLM Visualization Lab"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "torch==2.14.1",
  "transformers==5.19.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: loads the actual pinned Qwen model (use --real-model)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
